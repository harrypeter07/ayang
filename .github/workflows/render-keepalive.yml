name: Render Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose ping mode"
        required: true
        default: "test-30s"
        type: choice
        options:
          - test-30s
          - normal-5m

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping-render:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: "https://abackend-x026.onrender.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show trigger details
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Mode input: ${{ github.event.inputs.mode || 'scheduled-default' }}"
          echo "Target URL: $TARGET_URL"

      - name: Manual test mode (30 seconds)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test-30s' }}
        run: bash ./scripts/ping-render.sh "$TARGET_URL" 30 10

      - name: Manual normal mode (5 minutes)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'normal-5m' }}
        run: bash ./scripts/ping-render.sh "$TARGET_URL" 300 1

      - name: Scheduled mode (5 minutes)
        if: ${{ github.event_name == 'schedule' }}
        run: bash ./scripts/ping-render.sh "$TARGET_URL" 300 1
